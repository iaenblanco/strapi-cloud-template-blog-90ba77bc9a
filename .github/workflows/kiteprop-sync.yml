name: KiteProp Sync

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.STRAPI_SYNC_URL }}"
          test -n "${{ secrets.STRAPI_SYNC_TOKEN }}"

      - name: Check backend health
        run: |
          curl --fail --show-error --silent \
            --max-time 60 \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --header "Authorization: Bearer ${{ secrets.STRAPI_SYNC_TOKEN }}" \
            "${{ secrets.STRAPI_SYNC_URL }}/api/kiteprop-sync/health"

      - name: Run KiteProp delta sync
        run: |
          response="$(curl --fail --show-error --silent \
            --max-time 240 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.STRAPI_SYNC_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"dryRun":false,"maxPages":1,"maxItems":2}' \
            "${{ secrets.STRAPI_SYNC_URL }}/api/kiteprop-sync/properties/run-delta")"
          echo "$response"
          test "$(echo "$response" | jq -r '.result.summary.errors // 0')" = "0"
          test "$(echo "$response" | jq -r '.result.error // ""')" = ""

      - name: Run KiteProp new-property sync
        run: |
          response="$(curl --fail --show-error --silent \
            --max-time 240 \
            --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.STRAPI_SYNC_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"dryRun":false,"maxPages":1,"maxItems":2}' \
            "${{ secrets.STRAPI_SYNC_URL }}/api/kiteprop-sync/properties/run-sniffer")"
          echo "$response"
          test "$(echo "$response" | jq -r '.result.summary.errors // 0')" = "0"
          test "$(echo "$response" | jq -r '.result.error // ""')" = ""

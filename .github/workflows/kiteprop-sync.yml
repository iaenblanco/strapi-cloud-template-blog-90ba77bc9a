name: KiteProp Sync

on:
  schedule:
    - cron: '3,13,23,33,43,53 * * * *'
  workflow_dispatch:

concurrency:
  group: kiteprop-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Validate required secrets
        run: |
          test -n "${{ secrets.STRAPI_SYNC_URL }}"
          test -n "${{ secrets.STRAPI_SYNC_TOKEN }}"

      - name: Check backend health
        run: |
          curl --fail --show-error --silent \
            --max-time 60 \
            --retry 5 \
            --retry-delay 10 \
            --retry-all-errors \
            --header "Authorization: Bearer ${{ secrets.STRAPI_SYNC_TOKEN }}" \
            "${{ secrets.STRAPI_SYNC_URL }}/api/kiteprop-sync/health"

      - name: Run next KiteProp property sync
        run: |
          response="$(curl --fail --show-error --silent \
            --max-time 300 \
            --retry 2 \
            --retry-delay 10 \
            --retry-all-errors \
            --request POST \
            --header "Authorization: Bearer ${{ secrets.STRAPI_SYNC_TOKEN }}" \
            --header "Content-Type: application/json" \
            --data '{"dryRun":false,"maxPages":1,"maxItems":1}' \
            "${{ secrets.STRAPI_SYNC_URL }}/api/kiteprop-sync/properties/run-next")"
          echo "$response"
          test "$(echo "$response" | jq -r '.ok')" = "true"
          test "$(echo "$response" | jq -r '(.errors // []) | length')" = "0"
